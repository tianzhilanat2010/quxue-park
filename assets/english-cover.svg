<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="80%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#60a5fa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="blockA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="blockC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="360" fill="url(#skyGrad)"/>

  <!-- Sun & Halo -->
  <circle cx="510" cy="70" r="55" fill="#fef08a" opacity="0.45" filter="url(#softGlow)"/>
  <circle cx="510" cy="70" r="34" fill="#fde047"/>

  <!-- Rainbow Arc -->
  <path d="M -40 280 A 340 230 0 0 1 540 280" fill="none" stroke="url(#rainbow)" stroke-width="26" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9" filter="url(#dropShadow)">
    <circle cx="90" cy="80" r="28"/>
    <circle cx="125" cy="75" r="36"/>
    <circle cx="160" cy="82" r="26"/>
    <rect x="90" y="80" width="70" height="28" rx="14"/>

    <circle cx="430" cy="115" r="22"/>
    <circle cx="455" cy="108" r="30"/>
    <circle cx="485" cy="115" r="20"/>
    <rect x="430" y="115" width="55" height="22" rx="11"/>
  </g>

  <!-- Green Rolling Hills -->
  <path d="M 0 250 Q 180 200 340 240 T 600 230 L 600 360 L 0 360 Z" fill="#6ee7b7" opacity="0.7"/>
  <path d="M 0 265 Q 160 235 300 265 T 600 255 L 600 360 L 0 360 Z" fill="url(#grassGrad)"/>

  <!-- Flowers on grass -->
  <g>
    <circle cx="70" cy="305" r="7" fill="#f43f5e"/><circle cx="70" cy="305" r="3" fill="#fef08a"/>
    <circle cx="95" cy="325" r="6" fill="#fbbf24"/><circle cx="95" cy="325" r="2.5" fill="#ffffff"/>
    <circle cx="180" cy="315" r="8" fill="#ec4899"/><circle cx="180" cy="315" r="3" fill="#fef08a"/>
    <circle cx="480" cy="310" r="7" fill="#a855f7"/><circle cx="480" cy="310" r="3" fill="#fef08a"/>
    <circle cx="530" cy="325" r="8" fill="#f97316"/><circle cx="530" cy="325" r="3" fill="#ffffff"/>
  </g>

  <!-- Chibi Dr. Panda Sitting -->
  <g id="panda" filter="url(#dropShadow)">
    <!-- Ears -->
    <circle cx="260" cy="140" r="19" fill="#1e293b"/>
    <circle cx="340" cy="140" r="19" fill="#1e293b"/>
    <!-- Body -->
    <ellipse cx="300" cy="245" rx="55" ry="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Black arms -->
    <ellipse cx="250" cy="235" rx="16" ry="30" fill="#1e293b" transform="rotate(20 250 235)"/>
    <ellipse cx="350" cy="235" rx="16" ry="30" fill="#1e293b" transform="rotate(-20 350 235)"/>
    <!-- Black legs -->
    <ellipse cx="265" cy="285" rx="20" ry="15" fill="#1e293b"/>
    <circle cx="265" cy="285" r="6" fill="#f472b6" opacity="0.75"/>
    <ellipse cx="335" cy="285" rx="20" ry="15" fill="#1e293b"/>
    <circle cx="335" cy="285" r="6" fill="#f472b6" opacity="0.75"/>
    <!-- White Belly Vest -->
    <path d="M 275 220 Q 300 250 325 220 L 325 270 Q 300 280 275 270 Z" fill="#fef9c3"/>
    <circle cx="300" cy="240" r="3" fill="#eab308"/>
    <circle cx="300" cy="256" r="3" fill="#eab308"/>
    <!-- Head -->
    <circle cx="300" cy="175" r="52" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
    <!-- Eye patches -->
    <ellipse cx="280" cy="172" rx="16" ry="20" fill="#1e293b" transform="rotate(-15 280 172)"/>
    <ellipse cx="320" cy="172" rx="16" ry="20" fill="#1e293b" transform="rotate(15 320 172)"/>
    <!-- Eyes -->
    <circle cx="282" cy="172" r="8" fill="#0f172a"/>
    <circle cx="280" cy="169" r="3" fill="#ffffff"/>
    <circle cx="318" cy="172" r="8" fill="#0f172a"/>
    <circle cx="316" cy="169" r="3" fill="#ffffff"/>
    <!-- Gold Round Glasses -->
    <circle cx="280" cy="172" r="18" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="320" cy="172" r="18" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="298" y1="172" x2="302" y2="172" stroke="#f59e0b" stroke-width="3"/>
    <!-- Cute pink cheeks -->
    <circle cx="264" cy="188" r="8" fill="#fda4af" opacity="0.65"/>
    <circle cx="336" cy="188" r="8" fill="#fda4af" opacity="0.65"/>
    <!-- Nose & Smile -->
    <ellipse cx="300" cy="185" rx="5" ry="4" fill="#0f172a"/>
    <path d="M 295 192 Q 300 198 305 192" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bowtie -->
    <polygon points="292,205 300,210 292,215" fill="#f43f5e"/>
    <polygon points="308,205 300,210 308,215" fill="#f43f5e"/>
    <circle cx="300" cy="210" r="3.5" fill="#fde047"/>
    <!-- Scholar Cap -->
    <polygon points="300,105 345,120 300,135 255,120" fill="url(#goldCap)"/>
    <rect x="282" y="124" width="36" height="15" fill="#1e3a8a" rx="4"/>
    <line x1="300" y1="120" x2="330" y2="135" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="330" cy="138" r="3.5" fill="#eab308"/>
  </g>

  <!-- Colorful 3D Alphabet Toy Blocks (A, B, C) on the Left -->
  <g id="blocks" filter="url(#dropShadow)">
    <!-- Block A -->
    <rect x="115" y="215" width="58" height="58" rx="12" fill="url(#blockA)"/>
    <rect x="120" y="220" width="48" height="48" rx="8" fill="#fecaca" opacity="0.3"/>
    <text x="144" y="258" font-family="'Noto Sans SC', sans-serif, system-ui" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">A</text>

    <!-- Block B -->
    <rect x="75" y="260" width="56" height="56" rx="12" fill="url(#blockB)"/>
    <rect x="80" y="265" width="46" height="46" rx="8" fill="#bfdbfe" opacity="0.3"/>
    <text x="103" y="301" font-family="'Noto Sans SC', sans-serif, system-ui" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">B</text>

    <!-- Block C -->
    <rect x="150" y="260" width="56" height="56" rx="12" fill="url(#blockC)"/>
    <rect x="155" y="265" width="46" height="46" rx="8" fill="#fef08a" opacity="0.3"/>
    <text x="178" y="301" font-family="'Noto Sans SC', sans-serif, system-ui" font-weight="900" font-size="34" fill="#78350f" text-anchor="middle">C</text>
  </g>

  <!-- Glowing Open Storybook on the Right -->
  <g id="storybook" filter="url(#dropShadow)">
    <path d="M 375 290 Q 425 275 470 285 L 470 315 Q 425 305 375 320 Z" fill="#fef08a"/>
    <path d="M 470 285 Q 515 275 565 290 L 565 320 Q 515 305 470 315 Z" fill="#fffbeb"/>
    <path d="M 370 293 Q 425 278 470 288 L 470 318 Q 425 308 370 323 Z" fill="#ffffff"/>
    <path d="M 470 288 Q 515 278 570 293 L 570 323 Q 515 308 470 318 Z" fill="#f8fafc"/>
    <!-- Book cover spine -->
    <path d="M 368 320 Q 470 305 572 320 L 570 325 Q 470 310 368 325 Z" fill="#8b5cf6"/>

    <!-- Magical floating letters coming out from the book -->
    <g font-family="'Noto Sans SC', sans-serif" font-weight="900" filter="url(#softGlow)">
      <text x="430" y="250" font-size="24" fill="#ec4899">a</text>
      <text x="465" y="230" font-size="28" fill="#3b82f6">p</text>
      <text x="495" y="215" font-size="32" fill="#10b981">p</text>
      <text x="525" y="235" font-size="26" fill="#f59e0b">l</text>
      <text x="548" y="255" font-size="24" fill="#8b5cf6">e</text>
      <text x="530" y="195" font-size="28" fill="#f43f5e">🍎</text>
      <text x="410" y="195" font-size="22" fill="#0284c7">🐱 Cat</text>
    </g>
  </g>

  <!-- Sparkles & Floating Word Chips -->
  <g font-family="'Noto Sans SC', sans-serif, system-ui">
    <!-- Phonics chip -->
    <rect x="25" y="145" width="105" height="32" rx="16" fill="#ffffff" opacity="0.95" filter="url(#dropShadow)"/>
    <text x="77" y="166" font-size="12" font-weight="900" fill="#0284c7" text-anchor="middle">🔤 Phonics</text>

    <!-- Sight Words chip -->
    <rect x="465" y="145" width="115" height="32" rx="16" fill="#ffffff" opacity="0.95" filter="url(#dropShadow)"/>
    <text x="522" y="166" font-size="12" font-weight="900" fill="#d97706" text-anchor="middle">⭐ Sight Words</text>

    <!-- Hello bubble -->
    <rect x="235" y="48" width="130" height="36" rx="18" fill="#ffffff" filter="url(#dropShadow)"/>
    <text x="300" y="71" font-size="14" font-weight="900" fill="#db2777" text-anchor="middle">“Hello, World! ✨”</text>
    <polygon points="295,84 305,84 300,90" fill="#ffffff"/>
  </g>

  <!-- Golden Stars -->
  <g fill="#facc15" font-size="18">
    <text x="65" y="60">✦</text>
    <text x="210" y="110">★</text>
    <text x="385" y="105">✨</text>
    <text x="540" y="95">✦</text>
  </g>
</svg>
