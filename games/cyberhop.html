<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../assets/panda-wave-cover.webp">
  <title>熊猫博士跳跳乐 · 熊猫成长乐园</title>
  <script src="vendor/three.min.js"></script>
  <script src="panda-world.js"></script>
  <link rel="stylesheet" href="panda-game.css">
</head>
<body>
  <div id="canvas-container" aria-label="熊猫博士在云朵花园中跳跃"></div>
  <div id="damage-overlay" aria-hidden="true"></div>
  <div id="floating-text-container" aria-live="polite"></div>
  <header class="game-header">
    <a class="home-link" href="../index.html" aria-label="返回熊猫成长乐园">‹ 返回乐园</a>
    <div class="game-brand"><img class="brand-icon" src="../assets/panda-wave-cover.webp" alt="熊猫博士"><div><strong>熊猫博士跳跳乐</strong><small>PANDA'S GARDEN ADVENTURE</small></div></div>
    <div class="game-stats"><span id="hearts-display" aria-label="爱心">❤️❤️❤️</span><span>星光积分 <b id="score-display">100</b></span><span class="streak-label">连对 <b id="streak-display">x0</b></span></div>
    <button id="sound-btn" title="音效开关" aria-label="切换游戏音效">🔊</button>
    <details class="game-settings"><summary>⚙ 设置</summary><div class="settings-panel">
      <label for="mode-select">练习内容</label><select id="mode-select">
        <option value="grade2_term1">二年级上 · 加减与乘法</option><option value="grade2_mixed">二年级进阶 · 综合运算</option><option value="mul_add_sub">乘加与乘减</option><option value="chain_100">连加减与括号</option><option value="mul_div_adv">乘除法与逆运算</option>
      </select>
      <label for="char-select">博士的新衣服</label><select id="char-select"><option value="blue">天空蓝博士</option><option value="mint">薄荷绿博士</option><option value="peach">蜜桃粉博士</option></select>
      <label for="speed-select">思考时间</label><select id="speed-select"><option value="30">30 秒 · 轻快挑战</option><option value="45">45 秒 · 慢慢思考</option><option value="20">20 秒 · 进阶挑战</option></select>
    </div></details>
  </header>
  <section id="question-card" class="question-card">
    <div class="question-meta"><span id="level-badge">花园第 1 站</span><span id="mode-badge">数学小冒险</span><span id="timer-text">30.0s</span></div>
    <div id="question-text">准备好一起出发了吗？</div>
    <div class="timer-track"><div id="timer-bar"></div></div>
    <p>找到正确答案，陪熊猫博士跳到下一座小岛</p>
  </section>
  <div class="garden-caption"><span>✦ 云朵花园</span><small>一步一步，把好奇变成小小的进步</small></div>
  <footer class="answer-dock">
    <p>点小岛或选下面的答案 <span>· 键盘 1–5 也能跳跃</span></p>
    <div class="answer-grid">
<button id="opt-btn-0" onclick="handleChoice(0)"><small>小岛 1</small><strong id="opt-val-0">?</strong><span>跳这里 ↗</span></button>
<button id="opt-btn-1" onclick="handleChoice(1)"><small>小岛 2</small><strong id="opt-val-1">?</strong><span>跳这里 ↗</span></button>
<button id="opt-btn-2" onclick="handleChoice(2)"><small>小岛 3</small><strong id="opt-val-2">?</strong><span>跳这里 ↗</span></button>
<button id="opt-btn-3" onclick="handleChoice(3)"><small>小岛 4</small><strong id="opt-val-3">?</strong><span>跳这里 ↗</span></button>
<button id="opt-btn-4" onclick="handleChoice(4)"><small>小岛 5</small><strong id="opt-val-4">?</strong><span>跳这里 ↗</span></button>
    </div>
    <small class="game-rule">答错或超时扣 25 分，回到原地再试一次；爱心用完会补满。</small>
  </footer>
  <script>
    /**************************************************************
     * 1. 强化版 Web Audio 合成音效 (含倒计时急促滴答、雷击爆炸声)
     **************************************************************/
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playJump() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.16);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playTick(urgent = false) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(urgent ? 880 : 520, now);
        osc.frequency.exponentialRampToValueAtTime(urgent ? 440 : 300, now + 0.06);
        gain.gain.setValueAtTime(urgent ? 0.07 : 0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.065);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playSuccess(streak = 1) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        const boost = Math.min(streak * 20, 220);

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq + boost, now + idx * 0.055);
          gain.gain.setValueAtTime(0.22, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.055 + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.3);
        });
      }

      playThunderPenalty() {
        if(!this.enabled)return;this.init();
        [392,330].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+.31);});
      }
    }

    const sfx = new SoundEffects();

    /**************************************************************
     * 2. 二年级数学高迷惑度5选项题库生成器
     **************************************************************/
    const NUM_LANES = 5;
    let laneSpacing=window.innerWidth<650?2.15:2.9;
    const LANE_X = [-2,-1,0,1,2].map(i=>i*laneSpacing);
    let pendingRecovery=null;
    const ROW_SPACING = 9.6;

    let currentMode = 'grade2_term1';
    let score = 100; // 初始100分，方便直观感受扣分惩罚
    let streak = 0;
    let hearts = 3;
    let currentStep = 0;
    let currentQuestion = null;
    let isAnimating = false;

    // 倒计时状态
    let maxTimePerQuestion = 30;
    let timeRemaining = 30;
    let lastTickSecond = 30;

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 根据正确答案生成 4 个极具迷惑性的干扰项（防一眼排除）
    function buildSmartOptions(answer) {
      const distractors = new Set();
      const smartOffsets = [-10, 10, -2, 2, -1, 1, -3, 3, -4, 4, -6, 6, -8, 8, -9, 9, -12, 12];

      while (distractors.size < NUM_LANES - 1) {
        const offset = smartOffsets[randInt(0, smartOffsets.length - 1)];
        const candidate = answer + offset;
        if (candidate > 0 && candidate < 180 && candidate !== answer) {
          distractors.add(candidate);
        }
      }

      const options = [answer, ...Array.from(distractors)];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }
      return options;
    }

    function generateGrade2Problem(mode) {
      let subMode = mode;
      if (mode === 'grade2_mixed') {
        const pool = ['mul_add_sub', 'chain_100', 'mul_div_adv'];
        subMode = pool[randInt(0, pool.length - 1)];
      }

      let questionText = '';
      let answer = 0;
      let modeLabel = '';

      if (subMode === 'grade2_term1') {
        // 二年级上学期核心知识点：
        // 1. 100以内两位数加减法（一步计算，含进位/退位）
        // 2. 表内乘法（2~9的乘法口诀直接算）
        // 3. 简单的1~6表内乘加/乘减（加减数控制在1~10以内）
        // 4. 整十数或简单的加减两步（不带复杂括号）
        const type = randInt(0, 3);
        if (type === 0) {
          modeLabel = '二上·100以内加减';
          if (Math.random() < 0.55) {
            const a = randInt(15, 58);
            const b = randInt(12, 39);
            answer = a + b;
            questionText = `${a} + ${b} = ?`;
          } else {
            const a = randInt(42, 95);
            const b = randInt(14, a - 12);
            answer = a - b;
            questionText = `${a} - ${b} = ?`;
          }
        } else if (type === 1) {
          modeLabel = '二上·表内乘法口诀';
          const a = randInt(2, 9);
          const b = randInt(2, 9);
          answer = a * b;
          questionText = `${a} × ${b} = ?`;
        } else if (type === 2) {
          modeLabel = '二上·基础乘加乘减';
          const a = randInt(2, 6);
          const b = randInt(2, 6);
          const c = randInt(2, 9);
          if (Math.random() < 0.6) {
            answer = a * b + c;
            questionText = `${a} × ${b} + ${c} = ?`;
          } else {
            const subC = randInt(1, Math.min(9, a * b - 2));
            answer = a * b - subC;
            questionText = `${a} × ${b} - ${subC} = ?`;
          }
        } else {
          modeLabel = '二上·简单连加连减';
          const a = randInt(20, 45);
          const b = randInt(10, 25);
          const c = randInt(5, 18);
          if (Math.random() < 0.5) {
            answer = a + b + c;
            questionText = `${a} + ${b} + ${c} = ?`;
          } else {
            answer = a + b - c;
            questionText = `${a} + ${b} - ${c} = ?`;
          }
        }
      } else if (subMode === 'mul_add_sub') {
        modeLabel = '乘加/乘减混合';
        const a = randInt(3, 9);
        const b = randInt(3, 9);
        const prod = a * b;
        const type = randInt(0, 2);
        if (type === 0) {
          const c = randInt(12, 45);
          answer = prod + c;
          questionText = `${a} × ${b} + ${c} = ?`;
        } else if (type === 1) {
          const c = randInt(8, prod - 5);
          answer = prod - c;
          questionText = `${a} × ${b} - ${c} = ?`;
        } else {
          const c = randInt(15, 48);
          answer = c + prod;
          questionText = `${c} + ${a} × ${b} = ?`;
        }
      } else if (subMode === 'chain_100') {
        modeLabel = '连加连减与括号';
        const type = randInt(0, 2);
        if (type === 0) {
          const a = randInt(26, 58);
          const b = randInt(18, 42);
          const c = randInt(15, a + b - 12);
          answer = a + b - c;
          questionText = `${a} + ${b} - ${c} = ?`;
        } else if (type === 1) {
          const b = randInt(14, 34);
          const c = randInt(13, 29);
          const a = randInt(b + c + 12, 98);
          answer = a - (b + c);
          questionText = `${a} - (${b} + ${c}) = ?`;
        } else {
          const a = randInt(52, 95);
          const b = randInt(18, 39);
          const c = randInt(14, 36);
          answer = a - b + c;
          questionText = `${a} - ${b} + ${c} = ?`;
        }
      } else {
        modeLabel = '乘除进阶逆运算';
        const type = randInt(0, 2);
        if (type === 0) {
          const b = randInt(3, 9);
          const q = randInt(3, 9);
          const a = b * q;
          const c = randInt(2, 8);
          answer = q * c;
          questionText = `${a} ÷ ${b} × ${c} = ?`;
        } else if (type === 1) {
          const c = randInt(2, 6);
          const k = randInt(2, 5);
          const a = c * k;
          const b = randInt(3, 8);
          answer = (a * b) / c;
          questionText = `${a} × ${b} ÷ ${c} = ?`;
        } else {
          const b = randInt(4, 9);
          const q = randInt(4, 9);
          const a = b * q;
          const c = randInt(18, 56);
          answer = q + c;
          questionText = `${a} ÷ ${b} + ${c} = ?`;
        }
      }

      const options = buildSmartOptions(answer);
      return {
        questionText,
        answer,
        options,
        correctIndex: options.indexOf(answer),
        modeLabel
      };
    }

    /**************************************************************
     * 3. 卡通花园场景与熊猫博士
     **************************************************************/
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe4f2e9);
    scene.fog = new THREE.Fog(0xe4f2e9, 32, 100);

    const camera = new THREE.PerspectiveCamera(window.innerWidth<650?60:50, window.innerWidth / window.innerHeight, 0.1, 160);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    const ambientLight = new THREE.HemisphereLight(0xfffcf1, 0x94b9a5, .85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff3d3, 1.1);
    dirLight.position.set(-8, 16, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.left=-18; dirLight.shadow.camera.right=18;
    dirLight.shadow.camera.top=18; dirLight.shadow.camera.bottom=-18;
    dirLight.shadow.bias=-.001; scene.add(dirLight);

    const playerLight = new THREE.PointLight(0xfff1cf, .18, 14);
    scene.add(playerLight);
    const lightningLight = new THREE.PointLight(0xffd5ae, 0, 12);
    scene.add(lightningLight);
    function createNumberTexture(text, state = 'normal') {
      const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
      const ctx=canvas.getContext('2d');
      const palettes={normal:['#fff9e5','#43634a'],start:['#e2f0d2','#42654d'],urgent:['#fff0d1','#b47737'],correct:['#dff2c9','#3c7851']};
      const [bg,ink]=palettes[state]||palettes.normal;
      ctx.fillStyle=bg;ctx.fillRect(0,0,512,512);
      ctx.strokeStyle='#d6dfb5';ctx.lineWidth=12;ctx.beginPath();ctx.roundRect(22,22,468,468,80);ctx.stroke();
      ctx.fillStyle=ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${String(text).length>3?100:220}px sans-serif`;ctx.fillText(String(text),256,264);
      const tex=new THREE.CanvasTexture(canvas);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=4;return tex;
    }
    let player=buildPandaRig('blue');scene.add(player);
    function switchCharacterModel(type) {
      const old=player;player=buildPandaRig(type);player.position.copy(old.position);player.rotation.copy(old.rotation);
      scene.remove(old);disposeGardenObject(old);scene.add(player);
    }
    function setRobotMood(mood) { player.userData.mood=mood; }
    const activeTiles = [];
    const particles = [];
    const shockwaves = [];
    const lightningBolts = [];
    const ambientShapes = [];

    function initAmbientShapes() {
      for(let i=0;i<22;i++) {
        const cloud=i%3!==0,mesh=makeGardenProp(cloud?'cloud':'tree',i);
        mesh.position.set((i%2?-1:1)*(10+(i%4)*2.7),cloud?2+(i%4)*1.1:-2,-Math.floor(i/2)*10-4);
        mesh.userData.baseY=mesh.position.y;mesh.userData.phase=i;mesh.userData.cloud=cloud;
        mesh.scale.setScalar(cloud?1.1+(i%3)*.3:1.5);
        scene.add(mesh);ambientShapes.push(mesh);
      }
    }
    initAmbientShapes();
    function createTile(x,z,label,isStart=false,optionIndex=-1) {
      const group=new THREE.Group();group.position.set(x,0,z);group.scale.setScalar(window.innerWidth<650?.72:1);
      const cream=pandaMaterial(0xe8d8b1),grass=pandaMaterial(0x9fc982),soil=pandaMaterial(0xc7ad85);
      const topMat=pandaMaterial(0xffffff,{map:createNumberTexture(label,isStart?'start':'normal')});
      const boxMesh=new THREE.Mesh(new THREE.BoxGeometry(2.08,.16,2.08),[cream,cream,topMat,cream,cream,cream]);
      boxMesh.position.y=-.08;boxMesh.receiveShadow=true;group.add(boxMesh);
      const edge=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.47,.34,48),grass);edge.position.y=-.30;edge.receiveShadow=true;edge.castShadow=true;group.add(edge);
      const rock=new THREE.Mesh(new THREE.CylinderGeometry(1.46,.82,.85,9),soil);rock.position.y=-.84;group.add(rock);
      const glowMesh=new THREE.Mesh(new THREE.TorusGeometry(1.46,.045,8,48),pandaMaterial(0xd3e6b6));
      glowMesh.rotation.x=Math.PI/2;glowMesh.position.y=-.12;group.add(glowMesh);
      const pylons=new THREE.Group(),pylonMat=pandaMaterial(0xffe6a1);group.add(pylons);
      for(const side of [-1,1]) {
        const flower=new THREE.Group();flower.position.set(side*1.15,0,-.72);
        pandaBall(flower,pandaMaterial(0x6a9e65),[0,.08,0],[.04,.15,.04]);
        for(let j=0;j<5;j++){const a=j*Math.PI*2/5;pandaBall(flower,pylonMat,[Math.cos(a)*.11,.23,Math.sin(a)*.11],[.08,.045,.08]);}
        pandaBall(flower,pandaMaterial(0xe4b44b),[0,.25,0],[.07,.05,.07]);pylons.add(flower);
      }
      group.userData={boxMesh,glowMesh,pylons,pylonMat,topMat,label,optionIndex,broken:false,urgentMode:false,phase:0};
      scene.add(group);activeTiles.push(group);return group;
    }
    function spawnParticles(pos, colorHex, count = 35, isShatter = false) {
      for (let i = 0; i < count; i++) {
        const size = isShatter ? randInt(24, 48) / 100 : randInt(14, 28) / 100;
        const geo = isShatter
          ? new THREE.DodecahedronGeometry(size, 0)
          : new THREE.OctahedronGeometry(size, 0);

        const palette = isShatter
          ? [0xe7b87c, 0xdc2626, 0x1e293b, 0xfca5a5, 0xf97316]
          : [0x34d399, 0x8bbbae, 0xfbbf24, 0xe879f9, 0xa7f3d0];

        const mat = new THREE.MeshStandardMaterial({
          color: colorHex || palette[i % palette.length],
          roughness: 0.85,
          metalness: 0,
          emissive: isShatter ? 0x7f1d1d : 0x064e3b,
          emissiveIntensity: 0.4
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.x += (Math.random() - 0.5) * 1.5;
        mesh.position.y += (Math.random() - 0.2) * 0.6;
        mesh.position.z += (Math.random() - 0.5) * 1.5;

        const velocity = new THREE.Vector3(
          (Math.random() - 0.5) * (isShatter ? 0.34 : 0.3),
          isShatter ? Math.random() * 0.28 + 0.08 : Math.random() * 0.32 + 0.14,
          (Math.random() - 0.5) * (isShatter ? 0.34 : 0.3)
        );

        scene.add(mesh);
        particles.push({
          mesh,
          velocity,
          rotSpeed: new THREE.Vector3(Math.random() * 0.25, Math.random() * 0.25, Math.random() * 0.25),
          life: 1.0,
          decay: isShatter ? 0.015 : 0.018
        });
      }
    }

    function spawnShockwave(pos, colorHex = 0x34d399) {
      const geo = new THREE.RingGeometry(0.45, 0.78, 36);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(pos.x, 0.05, pos.z);
      scene.add(mesh);
      shockwaves.push({ mesh, scale: 1, alpha: 0.95 });
    }

    function showFloatingReward(text, isPositive = true) {
      const container = document.getElementById('floating-text-container');
      const el = document.createElement('div');
      el.className = `floating-reward ${isPositive?'positive':'retry'}`;
      el.innerText = text;
      container.appendChild(el);
      setTimeout(() => el.remove(), 1250);
    }

    /**************************************************************
     * 4. 答题、计分与重新尝试
     **************************************************************/
    let currentRowTiles = [];

    function updateHUD() {
      const scoreEl = document.getElementById('score-display');
      scoreEl.innerText = score;
      document.getElementById('streak-display').innerText = `x${streak}`;
      document.getElementById('hearts-display').innerText = '❤️'.repeat(hearts) + '🖤'.repeat(Math.max(0, 3 - hearts));
      document.getElementById('level-badge').innerText = `花园第 ${currentStep + 1} 站`;
    }

    function reshuffleCurrentRowOptions() {
      if (!currentQuestion || currentRowTiles.length === 0) return;

      const freshOptions = buildSmartOptions(currentQuestion.answer);
      currentQuestion.options = freshOptions;
      currentQuestion.correctIndex = freshOptions.indexOf(currentQuestion.answer);

      currentRowTiles.forEach((tile, idx) => {
        const val = freshOptions[idx];
        tile.userData.label = val;
        tile.userData.broken = false;
        tile.userData.urgentMode = false;
        tile.visible = true;
        tile.position.y = -2.2;
        const newTex = createNumberTexture(val, 'normal');
        tile.userData.boxMesh.material[2].map.dispose();
        tile.userData.boxMesh.material[2].map = newTex;
        tile.userData.boxMesh.material[2].emissiveMap = newTex;
        tile.userData.pylonMat.color.setHex(0xffe6a1);
        tile.userData.glowMesh.material.color.setHex(0xd3e6b6);

        const btnVal = document.getElementById(`opt-val-${idx}`);
        const btn = document.getElementById(`opt-btn-${idx}`);
        if (btnVal) btnVal.innerText = val;
        if (btn) btn.disabled = false;
      });
    }

    function spawnNextQuestionRow() {
      currentQuestion = generateGrade2Problem(currentMode);
      timeRemaining = maxTimePerQuestion;
      lastTickSecond = Math.ceil(timeRemaining);

      document.getElementById('question-text').innerText = currentQuestion.questionText;
      document.getElementById('mode-badge').innerText = currentQuestion.modeLabel;
      document.getElementById('question-card').classList.remove('urgent-card');

      const nextZ = -(currentStep + 1) * ROW_SPACING;
      currentRowTiles = [];

      currentQuestion.options.forEach((val, idx) => {
        const tile = createTile(LANE_X[idx], nextZ, val, false, idx);
        tile.position.y = -2.8;
        currentRowTiles.push(tile);

        const btnVal = document.getElementById(`opt-val-${idx}`);
        const btn = document.getElementById(`opt-btn-${idx}`);
        if (btnVal) btnVal.innerText = val;
        if (btn) btn.disabled = false;
      });

      while (activeTiles.length > 22) {
        const old = activeTiles.shift();
        scene.remove(old);disposeGardenObject(old);
      }

      updateHUD();
    }

    let gameEpoch=0;
    function resetGame() {
      gameEpoch++;
      jumpAnim=null;pendingRecovery=null;
      score = 100;
      streak = 0;
      hearts = 3;
      currentStep = 0;
      isAnimating = false;
      setRobotMood('normal');

      activeTiles.forEach(t => {scene.remove(t);disposeGardenObject(t);});
      activeTiles.length = 0;

      createTile(0, 0, '出发', true, -1);
      player.position.set(0, 0, 0);
      player.rotation.set(0, 0, 0);

      spawnNextQuestionRow();
    }

    function executeHeavyPenalty(strikePos, returnPos, reasonText) {
      streak = 0;
      const penaltyPoints = 25;
      score = Math.max(0, score - penaltyPoints);
      hearts = Math.max(0, hearts - 1);

      sfx.playThunderPenalty();
      setRobotMood('shocked');


      spawnParticles(strikePos, 0xf3cb83, 18, false);
      spawnShockwave(strikePos, 0xf3cb83);


      const overlay = document.getElementById('damage-overlay');
      overlay.style.opacity = '1';
      setTimeout(() => {

        overlay.style.opacity = '0';
      }, 650);

      if (hearts === 0) {
        showFloatingReward(`再试一次！-${penaltyPoints}分 · 爱心补满`, false);
        hearts = 3;
      } else {
        showFloatingReward(`${reasonText} -${penaltyPoints}分！选项已重排`, false);
      }

      updateHUD();

      const epoch=gameEpoch;
      pendingRecovery={strikePos,returnPos};
      let fallT = 0;
      const recoverInterval = setInterval(() => {
        if(epoch!==gameEpoch){clearInterval(recoverInterval);return;}
        fallT += 0.065;
        if (fallT < 0.55) {
          player.position.y = Math.sin(fallT / .55 * Math.PI) * .35;
          player.rotation.z = Math.sin(fallT * 14) * .06;
        } else if (fallT < 1.0) {
          const t = (fallT - 0.55) / 0.45;
          player.position.lerpVectors(strikePos, returnPos, t);
          player.position.y = Math.sin(t * Math.PI) * 2.4;
          player.rotation.set(0, 0, 0);
        } else {
          clearInterval(recoverInterval);pendingRecovery=null;
          player.position.copy(returnPos);
          player.rotation.set(0, 0, 0);
          setRobotMood('normal');
          spawnShockwave(returnPos, 0x8bbbae);

          reshuffleCurrentRowOptions();
          timeRemaining = maxTimePerQuestion;
          lastTickSecond = Math.ceil(timeRemaining);
          document.getElementById('question-card').classList.remove('urgent-card');
          isAnimating = false;
        }
      }, 20);
    }

    let jumpAnim = null;

    window.handleChoice = function(optionIdx) {
      if (isAnimating || !currentRowTiles[optionIdx]) return;
      const targetTile = currentRowTiles[optionIdx];
      if (targetTile.userData.broken) return;

      isAnimating = true;
      sfx.playJump();

      const startPos = player.position.clone();
      const endPos = new THREE.Vector3(targetTile.position.x, 0, targetTile.position.z);
      const isCorrect = optionIdx === currentQuestion.correctIndex;

      jumpAnim = {
        startPos,
        endPos,
        targetTile,
        optionIdx,
        isCorrect,
        progress: 0,
        duration: 0.95
      };
    };

    function onJumpLanded(anim) {
      const { targetTile, isCorrect, startPos, endPos } = anim;

      if (isCorrect) {
        streak++;
        const speedBonus = Math.ceil(timeRemaining * 2);
        const gained = 20 + streak * 5 + speedBonus;
        score += gained;
        currentStep++;

        sfx.playSuccess(streak);
        setRobotMood('happy');
        const okTex = createNumberTexture(targetTile.userData.label, 'correct');
        targetTile.userData.boxMesh.material[2].map.dispose();
        targetTile.userData.boxMesh.material[2].map = okTex;
        targetTile.userData.boxMesh.material[2].emissiveMap = okTex;
        targetTile.userData.pylonMat.color.setHex(0x34d399);
        targetTile.userData.glowMesh.material.color.setHex(0x10b981);

        spawnParticles(endPos, null, 38, false);
        spawnShockwave(endPos, 0x34d399);
        showFloatingReward(`+${gained}分 (含极速奖+${speedBonus}) 🔥x${streak}`, true);

        ambientShapes.forEach(mesh => {
          if (mesh.position.z > player.position.z + 14) {
            mesh.position.z -= 110;
          }
        });

        const epoch=gameEpoch;
        setTimeout(() => {
          if(epoch!==gameEpoch)return;
          setRobotMood('normal');
          spawnNextQuestionRow();
          isAnimating = false;
        }, 240);
      } else {
        targetTile.userData.broken = true;
        targetTile.visible = false;
        executeHeavyPenalty(endPos, startPos, '再想一想');
      }
    }

    function onTimerExpired() {
      if (isAnimating) return;
      isAnimating = true;

      currentRowTiles.forEach(tile => {
        tile.userData.broken = true;
        tile.visible = false;
        spawnParticles(tile.position, 0xe7b87c, 10, true);
      });

      const currentPos = player.position.clone();
      executeHeavyPenalty(currentPos, currentPos, '慢慢来，再试一次');
    }

    /**************************************************************
     * 5. 交互控制与快捷键绑定 (1-5 数字键)
     **************************************************************/
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button,select,a,details')) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const meshes = currentRowTiles
        .filter(t => !t.userData.broken)
        .map(t => t.userData.boxMesh);

      const intersects = raycaster.intersectObjects(meshes);
      if (intersects.length > 0) {
        const hitGroup = intersects[0].object.parent;
        if (hitGroup && hitGroup.userData.optionIndex !== undefined) {
          handleChoice(hitGroup.userData.optionIndex);
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.closest('select,input,button,summary') || e.repeat) return;
      if (['1', '2', '3', '4', '5'].includes(e.key)) {
        handleChoice(parseInt(e.key, 10) - 1);
      }
    });

    document.getElementById('mode-select').addEventListener('change', (e) => {
      currentMode = e.target.value;
      resetGame();
    });

    document.getElementById('char-select').addEventListener('change', (e) => {
      switchCharacterModel(e.target.value);
    });

    document.getElementById('speed-select').addEventListener('change', (e) => {
      maxTimePerQuestion = parseInt(e.target.value, 10);
      resetGame();
    });

    document.getElementById('sound-btn').addEventListener('click', (e) => {
      sfx.enabled = !sfx.enabled;
      e.currentTarget.innerText = sfx.enabled ? '🔊' : '🔇';
    });

    window.addEventListener('resize', () => {
      const spacing=window.innerWidth<650?2.15:2.9,factor=spacing/laneSpacing;
      if(factor!==1) {
        laneSpacing=spacing;LANE_X.forEach((_,i)=>LANE_X[i]=(i-2)*spacing);
        activeTiles.forEach(tile=>{tile.position.x*=factor;tile.scale.setScalar(window.innerWidth<650?.72:1);});
        player.position.x*=factor;
        if(jumpAnim){jumpAnim.startPos.x*=factor;jumpAnim.endPos.x*=factor;}
        if(pendingRecovery){new Set([pendingRecovery.strikePos,pendingRecovery.returnPos]).forEach(pos=>pos.x*=factor);}
      }
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.fov=window.innerWidth<650?60:50;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /**************************************************************
     * 6. 主渲染循环 (含紧迫倒计时系统与 3D 物理动态)
     **************************************************************/
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      if (!isAnimating && currentQuestion && !document.hidden && !document.querySelector('.game-settings').open) {
        timeRemaining = Math.max(0, timeRemaining - dt);
        const pct = (timeRemaining / maxTimePerQuestion) * 100;
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const qCard = document.getElementById('question-card');

        timerBar.style.width = `${pct}%`;
        timerText.innerText = `${timeRemaining.toFixed(1)}s`;

        const ceilSec = Math.ceil(timeRemaining);
        if (ceilSec !== lastTickSecond && ceilSec > 0) {
          lastTickSecond = ceilSec;
          if (ceilSec <= 5) {
            sfx.playTick(true);
          } else if (ceilSec <= 10) {
            sfx.playTick(false);
          }
        }

        if (timeRemaining <= 10) {
          timerBar.className = 'h-full rounded-full bg-gradient-to-r from-red-500 via-rose-500 to-amber-500 transition-all duration-75';
          timerText.className = 'text-rose-400 font-mono text-sm font-black animate-ping';
          qCard.classList.add('urgent-card');

          currentRowTiles.forEach(tile => {
            if (!tile.userData.broken && !tile.userData.urgentMode) {
              tile.userData.urgentMode = true;
              const urgTex = createNumberTexture(tile.userData.label, 'urgent');
              tile.userData.boxMesh.material[2].map.dispose();
              tile.userData.boxMesh.material[2].map = urgTex;
              tile.userData.boxMesh.material[2].emissiveMap = urgTex;
              tile.userData.glowMesh.material.color.setHex(0xe7b87c);
            }
          });
        } else {
          timerBar.className = 'h-full rounded-full bg-gradient-to-r from-emerald-400 via-cyan-400 to-indigo-400 transition-all duration-75';
          timerText.className = 'text-amber-300 font-mono text-sm';
        }

        if (timeRemaining <= 0) {
          onTimerExpired();
        }
      }

      animatePanda(player,elapsed,dt,jumpAnim?jumpAnim.progress:null,isAnimating&&!jumpAnim);
      if (jumpAnim) {
        jumpAnim.progress += dt / jumpAnim.duration;
        const t = Math.min(jumpAnim.progress, 1);

        const flight=Math.max(0,(t-.16)/.84);
        const travel=flight*flight*(3-2*flight);
        player.position.lerpVectors(jumpAnim.startPos,jumpAnim.endPos,travel);
        player.position.y=Math.sin(flight*Math.PI)*1.55;
        player.rotation.y=Math.sin(flight*Math.PI)*Math.sign(jumpAnim.endPos.x-jumpAnim.startPos.x)*.30;
        if (t >= 1) {
          player.position.copy(jumpAnim.endPos);
          player.rotation.set(0, 0, 0);
          player.userData.pelvis.rotation.set(0,0,0);
          player.userData.landing=1;
          const finished = jumpAnim;
          jumpAnim = null;
          onJumpLanded(finished);
        }
      }

      activeTiles.forEach(tile=>{
        if(!tile.userData.broken){tile.position.y+=(0-tile.position.y)*Math.min(1,dt*10);}
      });
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const b = lightningBolts[i];
        b.life -= 0.06;
        b.mesh.material.opacity = Math.max(0, b.life);
        if (b.life <= 0) {
          scene.remove(b.mesh);
          lightningBolts.splice(i, 1);
        }
      }
      if (lightningLight.intensity > 0) {
        lightningLight.intensity = Math.max(0, lightningLight.intensity - 0.35);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.add(p.velocity);
        p.velocity.y -= 0.012;
        p.mesh.rotation.x += p.rotSpeed.x;
        p.mesh.rotation.y += p.rotSpeed.y;
        p.life -= p.decay;
        p.mesh.scale.setScalar(Math.max(0.001, p.life));
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 0.18;
        sw.alpha -= 0.038;
        sw.mesh.scale.setScalar(sw.scale);
        sw.mesh.material.opacity = Math.max(0, sw.alpha);
        if (sw.alpha <= 0) {
          scene.remove(sw.mesh);
          shockwaves.splice(i, 1);
        }
      }

      ambientShapes.forEach(mesh=>{
        mesh.position.y=mesh.userData.baseY+Math.sin(elapsed*.35+mesh.userData.phase)*.18;
        if(mesh.position.z>player.position.z+20)mesh.position.z-=110;
      });
      const desiredCamPos = new THREE.Vector3(
        player.position.x * 0.38,
        window.innerWidth < 650 ? 8.5 : 7.6,
        player.position.z + (window.innerWidth < 650 ? 15.5 : 10.8)
      );
      camera.position.lerp(desiredCamPos, 0.08);
      camera.lookAt(player.position.x * 0.22, window.innerWidth < 650 ? 1 : 1.35, player.position.z - 2.4);
      dirLight.position.set(player.position.x-8,16,player.position.z+12);dirLight.target.position.copy(player.position);dirLight.target.updateMatrixWorld();

      playerLight.position.set(player.position.x, player.position.y + 4.5, player.position.z);

      renderer.render(scene, camera);
    }

    resetGame();
    camera.position.set(0,window.innerWidth<650?8.5:7.6,window.innerWidth<650?15.5:10.8);
    animate();
  </script>
</body>
</html>
