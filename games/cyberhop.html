<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CyberHop 3D Pro - 二年级星际数学矩阵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #090d16 65%, #020409 100%);
      color: #ffffff;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ThreeUI 高级多层毛玻璃拟态 */
    .glass-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .glass-btn {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .glass-btn:hover:not(:disabled) {
      transform: translateY(-6px) scale(1.05);
      border-color: rgba(56, 189, 248, 0.85);
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .glass-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.96);
    }

    /* 剧烈惩罚屏幕震动 */
    @keyframes heavyShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-18px, -12px) rotate(-2.5deg); }
      20% { transform: translate(18px, 10px) rotate(2.5deg); }
      30% { transform: translate(-16px, 12px) rotate(-2deg); }
      40% { transform: translate(14px, -10px) rotate(2deg); }
      55% { transform: translate(-10px, 8px) rotate(-1.2deg); }
      70% { transform: translate(8px, -6px) rotate(1deg); }
      85% { transform: translate(-4px, 3px) rotate(-0.5deg); }
    }

    .shake-heavy {
      animation: heavyShake 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 倒计时危急脉冲 */
    @keyframes dangerPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.35), inset 0 0 15px rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.8); }
      50% { box-shadow: 0 0 50px rgba(239, 68, 68, 0.85), inset 0 0 30px rgba(239, 68, 68, 0.55); border-color: rgba(254, 202, 202, 1); transform: scale(1.03); }
    }

    .urgent-card {
      animation: dangerPulse 0.5s infinite ease-in-out;
    }

    /* 飘字奖惩动画 */
    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateY(20px) scale(0.6); }
      18% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      80% { opacity: 1; transform: translateY(-55px) scale(1); }
      100% { opacity: 0; transform: translateY(-85px) scale(0.9); }
    }

    .floating-reward {
      animation: floatUpFade 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(100px);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <script>
    /**************************************************************
     * 1. 强化版 Web Audio 合成音效 (含倒计时急促滴答、雷击爆炸声)
     **************************************************************/
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playJump() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.16);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      playTick(urgent = false) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = urgent ? 'square' : 'triangle';
        osc.frequency.setValueAtTime(urgent ? 880 : 520, now);
        osc.frequency.exponentialRampToValueAtTime(urgent ? 440 : 300, now + 0.06);
        gain.gain.setValueAtTime(urgent ? 0.18 : 0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.065);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playSuccess(streak = 1) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        const boost = Math.min(streak * 20, 220);

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq + boost, now + idx * 0.055);
          gain.gain.setValueAtTime(0.22, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.055 + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.3);
        });
      }

      // 强烈雷击与崩塌低音炮惩罚音效
      playThunderPenalty() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;

        // 1. 白噪音雷击爆裂
        const bufferSize = this.ctx.sampleRate * 0.45;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.15));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(420, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.45, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.44);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);

        // 2. 双锯齿波警报下坠音
        [190, 135, 92].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + idx * 0.11);
          osc.frequency.linearRampToValueAtTime(freq * 0.55, now + idx * 0.11 + 0.25);
          gain.gain.setValueAtTime(0.26, now + idx * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.11 + 0.26);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.11);
          osc.stop(now + idx * 0.11 + 0.27);
        });
      }
    }

    const sfx = new SoundEffects();

    /**************************************************************
     * 2. 二年级数学高迷惑度5选项题库生成器
     **************************************************************/
    const NUM_LANES = 5;
    const LANE_X = [-5.8, -2.9, 0, 2.9, 5.8];
    const ROW_SPACING = 5.6;

    let currentMode = 'grade2_term1';
    let score = 100; // 初始100分，方便直观感受扣分惩罚
    let streak = 0;
    let hearts = 3;
    let currentStep = 0;
    let currentQuestion = null;
    let isAnimating = false;

    // 倒计时状态
    let maxTimePerQuestion = 30;
    let timeRemaining = 30;
    let lastTickSecond = 30;

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 根据正确答案生成 4 个极具迷惑性的干扰项（防一眼排除）
    function buildSmartOptions(answer) {
      const distractors = new Set();
      const smartOffsets = [-10, 10, -2, 2, -1, 1, -3, 3, -4, 4, -6, 6, -8, 8, -9, 9, -12, 12];

      while (distractors.size < NUM_LANES - 1) {
        const offset = smartOffsets[randInt(0, smartOffsets.length - 1)];
        const candidate = answer + offset;
        if (candidate > 0 && candidate < 180 && candidate !== answer) {
          distractors.add(candidate);
        }
      }

      const options = [answer, ...Array.from(distractors)];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }
      return options;
    }

    function generateGrade2Problem(mode) {
      let subMode = mode;
      if (mode === 'grade2_mixed') {
        const pool = ['mul_add_sub', 'chain_100', 'mul_div_adv'];
        subMode = pool[randInt(0, pool.length - 1)];
      }

      let questionText = '';
      let answer = 0;
      let modeLabel = '';

      if (subMode === 'grade2_term1') {
        // 二年级上学期核心知识点：
        // 1. 100以内两位数加减法（一步计算，含进位/退位）
        // 2. 表内乘法（2~9的乘法口诀直接算）
        // 3. 简单的1~6表内乘加/乘减（加减数控制在1~10以内）
        // 4. 整十数或简单的加减两步（不带复杂括号）
        const type = randInt(0, 3);
        if (type === 0) {
          modeLabel = '二上·100以内加减';
          if (Math.random() < 0.55) {
            const a = randInt(15, 58);
            const b = randInt(12, 39);
            answer = a + b;
            questionText = `${a} + ${b} = ?`;
          } else {
            const a = randInt(42, 95);
            const b = randInt(14, a - 12);
            answer = a - b;
            questionText = `${a} - ${b} = ?`;
          }
        } else if (type === 1) {
          modeLabel = '二上·表内乘法口诀';
          const a = randInt(2, 9);
          const b = randInt(2, 9);
          answer = a * b;
          questionText = `${a} × ${b} = ?`;
        } else if (type === 2) {
          modeLabel = '二上·基础乘加乘减';
          const a = randInt(2, 6);
          const b = randInt(2, 6);
          const c = randInt(2, 9);
          if (Math.random() < 0.6) {
            answer = a * b + c;
            questionText = `${a} × ${b} + ${c} = ?`;
          } else {
            const subC = randInt(1, Math.min(9, a * b - 2));
            answer = a * b - subC;
            questionText = `${a} × ${b} - ${subC} = ?`;
          }
        } else {
          modeLabel = '二上·简单连加连减';
          const a = randInt(20, 45);
          const b = randInt(10, 25);
          const c = randInt(5, 18);
          if (Math.random() < 0.5) {
            answer = a + b + c;
            questionText = `${a} + ${b} + ${c} = ?`;
          } else {
            answer = a + b - c;
            questionText = `${a} + ${b} - ${c} = ?`;
          }
        }
      } else if (subMode === 'mul_add_sub') {
        modeLabel = '乘加/乘减混合';
        const a = randInt(3, 9);
        const b = randInt(3, 9);
        const prod = a * b;
        const type = randInt(0, 2);
        if (type === 0) {
          const c = randInt(12, 45);
          answer = prod + c;
          questionText = `${a} × ${b} + ${c} = ?`;
        } else if (type === 1) {
          const c = randInt(8, prod - 5);
          answer = prod - c;
          questionText = `${a} × ${b} - ${c} = ?`;
        } else {
          const c = randInt(15, 48);
          answer = c + prod;
          questionText = `${c} + ${a} × ${b} = ?`;
        }
      } else if (subMode === 'chain_100') {
        modeLabel = '连加连减与括号';
        const type = randInt(0, 2);
        if (type === 0) {
          const a = randInt(26, 58);
          const b = randInt(18, 42);
          const c = randInt(15, a + b - 12);
          answer = a + b - c;
          questionText = `${a} + ${b} - ${c} = ?`;
        } else if (type === 1) {
          const b = randInt(14, 34);
          const c = randInt(13, 29);
          const a = randInt(b + c + 12, 98);
          answer = a - (b + c);
          questionText = `${a} - (${b} + ${c}) = ?`;
        } else {
          const a = randInt(52, 95);
          const b = randInt(18, 39);
          const c = randInt(14, 36);
          answer = a - b + c;
          questionText = `${a} - ${b} + ${c} = ?`;
        }
      } else {
        modeLabel = '乘除进阶逆运算';
        const type = randInt(0, 2);
        if (type === 0) {
          const b = randInt(3, 9);
          const q = randInt(3, 9);
          const a = b * q;
          const c = randInt(2, 8);
          answer = q * c;
          questionText = `${a} ÷ ${b} × ${c} = ?`;
        } else if (type === 1) {
          const c = randInt(2, 6);
          const k = randInt(2, 5);
          const a = c * k;
          const b = randInt(3, 8);
          answer = (a * b) / c;
          questionText = `${a} × ${b} ÷ ${c} = ?`;
        } else {
          const b = randInt(4, 9);
          const q = randInt(4, 9);
          const a = b * q;
          const c = randInt(18, 56);
          answer = q + c;
          questionText = `${a} ÷ ${b} + ${c} = ?`;
        }
      }

      const options = buildSmartOptions(answer);
      return {
        questionText,
        answer,
        options,
        correctIndex: options.indexOf(answer),
        modeLabel
      };
    }

    function createNumberTexture(text, state = 'normal') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const palettes = {
        start: { bg1: '#091930', bg2: '#050b14', border: '#38bdf8', accent: '#7dd3fc', text: '#38bdf8', glow: '#0284c7' },
        normal: { bg1: '#181342', bg2: '#09071a', border: '#818cf8', accent: '#c084fc', text: '#ffffff', glow: '#6366f1' },
        urgent: { bg1: '#4c0519', bg2: '#1f030b', border: '#fb7185', accent: '#f43f5e', text: '#ffe4e6', glow: '#e11d48' },
        correct: { bg1: '#064e3b', bg2: '#022c22', border: '#34d399', accent: '#6ee7b7', text: '#ecfdf5', glow: '#10b981' },
        wrong: { bg1: '#7f1d1d', bg2: '#2a0606', border: '#ef4444', accent: '#fca5a5', text: '#fecaca', glow: '#dc2626' }
      };
      const p = palettes[state] || palettes.normal;

      // 1. 深邃科技感径向底色
      const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
      grad.addColorStop(0, p.bg1);
      grad.addColorStop(1, p.bg2);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(12, 12, 488, 488, 72);
      ctx.fill();

      // 2. 蜂巢微网格暗纹与科幻电路线
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 2;
      for (let i = 48; i < 464; i += 32) {
        ctx.beginPath();
        ctx.moveTo(40, i); ctx.lineTo(472, i);
        ctx.moveTo(i, 40); ctx.lineTo(i, 472);
        ctx.stroke();
      }

      // 3. 外圈双层发光霓虹装甲框
      ctx.lineWidth = 14;
      ctx.strokeStyle = p.border;
      ctx.shadowColor = p.glow;
      ctx.shadowBlur = 28;
      ctx.beginPath();
      ctx.roundRect(18, 18, 476, 476, 64);
      ctx.stroke();

      // 4. 内圈八角科技能量环与四角准星刻度
      ctx.shadowBlur = 10;
      ctx.strokeStyle = p.accent;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(256, 256, 178, 0, Math.PI * 2);
      ctx.stroke();

      ctx.setLineDash([18, 14]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(256, 256, 196, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 四角L型高光导轨
      const corners = [[52, 52, 1, 1], [460, 52, -1, 1], [52, 460, 1, -1], [460, 460, -1, -1]];
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#ffffff';
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy + dy * 42);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + dx * 42, cy);
        ctx.stroke();
      });

      // 5. 中心立体发光数字
      ctx.fillStyle = p.text;
      ctx.font = '900 205px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = p.border;
      ctx.shadowBlur = 40;
      ctx.fillText(String(text), 256, 266);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 4;
      return texture;
    }

    // 生成海绵宝宝多孔海绵高清材质纹理
    function createSpongeTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fde047';
      ctx.fillRect(0, 0, 256, 256);

      // 细腻海绵气孔
      const pores = [
        [45, 50, 14], [195, 42, 18], [120, 85, 10],
        [55, 160, 16], [210, 155, 12], [150, 210, 15],
        [85, 220, 9], [30, 110, 8], [225, 95, 10]
      ];
      pores.forEach(([x, y, r]) => {
        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(x + 2, y + 2, r * 0.78, 0, Math.PI * 2);
        ctx.fill();
      });
      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    // 生成派大星沙滩花短裤纹理
    function createPatrickPantsTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#a3e635';
      ctx.fillRect(0, 0, 256, 128);

      // 紫色夏威夷花朵图案
      ctx.fillStyle = '#9333ea';
      const flowers = [[50, 65], [135, 50], [210, 75], [90, 105], [175, 100]];
      flowers.forEach(([fx, fy]) => {
        for (let a = 0; a < 5; a++) {
          const ang = (a * Math.PI * 2) / 5;
          ctx.beginPath();
          ctx.arc(fx + Math.cos(ang) * 10, fy + Math.sin(ang) * 10, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      // 腰部紫黑条纹
      ctx.fillStyle = '#581c87';
      ctx.fillRect(0, 0, 256, 16);
      return new THREE.CanvasTexture(c);
    }

    // 生成派大星颗粒皮肤纹理
    function createPatrickSkinTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fb7185';
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = '#f43f5e';
      for (let i = 0; i < 45; i++) {
        ctx.beginPath();
        ctx.arc((i * 53) % 256, (i * 97) % 256, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    // 3. 赛博光翼机甲英雄 (Cyber Mecha Rig)

      torsoMesh.position.y = 0.38;
      spine.add(torsoMesh);

      const chestCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.14, 1), coreMat);
      chestCore.position.set(0, 0.42, -0.39);
      spine.add(chestCore);

      const wingsGroup = new THREE.Group();
      wingsGroup.position.set(0, 0.48, 0.32);
      spine.add(wingsGroup);

      const rightWingPivot = new THREE.Group();
      wingsGroup.add(leftWingPivot, rightWingPivot);

      const wingBladeGeo = new THREE.ConeGeometry(0.18, 1.25, 4);

        leftWingPivot.add(bladeL);

        const bladeR = new THREE.Mesh(wingBladeGeo, wingMat);
        bladeR.position.set(0.55 + w * 0.28, 0.25 - w * 0.18, 0.1);

      const headGroup = new THREE.Group();

      helmetMesh.position.y = 0.28;

      const visorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.26, 0.1), new THREE.MeshBasicMaterial({ color: 0x060913 }));
      visorMesh.position.set(0, 0.28, -0.31);
      headGroup.add(visorMesh);

      const eyeGeo = new THREE.BoxGeometry(0.14, 0.07, 0.04);
      const leftEye = new THREE.Mesh(eyeGeo, glowMat);
      leftEye.position.set(-0.14, 0.29, -0.36);
      const rightEye = new THREE.Mesh(eyeGeo, glowMat);
      rightEye.position.set(0.14, 0.29, -0.36);
      headGroup.add(leftEye, rightEye);

      function createArmRig(side) {

        shoulder.position.set(side * 0.56, 0.62, 0);
        const pauldron = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 1), accentMat);
        shoulder.add(pauldron);
        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.085, 0.38, 10), darkJointMat);
        upperArm.position.y = -0.22;
        shoulder.add(upperArm);
        const elbow = new THREE.Group();
        elbow.position.y = -0.4;
        shoulder.add(elbow);
        const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.38, 0.2), armorMat);

      const leftArmRig = createArmRig(-1);
      const rightArmRig = createArmRig(1);
      spine.add(leftArmRig.shoulder, rightArmRig.shoulder);

      function createLegRig(side) {
        const hip = new THREE.Group();
        hip.position.set(side * 0.24, -0.08, 0);
        const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.1, 0.44, 10), armorMat);
        thigh.position.y = -0.22;
        hip.add(thigh);
        const knee = new THREE.Group();
        knee.position.y = -0.44;
        hip.add(knee);
        const shin = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.44, 0.24), darkJointMat);
        shin.position.y = -0.22;

      const leftLegRig = createLegRig(-1);
      const rightLegRig = createLegRig(1);

      const ringGeo = new THREE.RingGeometry(0.45, 0.58, 6);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.75 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.04;
      root.add(ring);

      root.userData = {
        charType: 'mecha',

        rightArmRig,

        rightLegRig,
        leftWingPivot,
        rightWingPivot,
        chestCore,
        ring,
        armorMat,
        accentMat,
        glowMat,
        coreMat,
        wingMat,
        ringMat,
        defaultBodyHex: 0xf8fafc,
        defaultAccentHex: 0x38bdf8,

    let currentCharacterType = 'spongebob';
    let player = buildSpongeBobRig();
    scene.add(player);

    // 实时切换 3D 角色模型
    function switchCharacterModel(type) {
      currentCharacterType = type;
      const oldPos = player.position.clone();
      const oldRot = player.rotation.clone();
      scene.remove(player);

      if (type === 'spongebob') {
        player = buildSpongeBobRig();
      } else if (type === 'patrick') {
        player = buildPatrickRig();
      } else {
        player = buildMechaRig();
      }

      player.position.copy(oldPos);
      player.rotation.copy(oldRot);
      scene.add(player);
      spawnShockwave(oldPos, 0xfde047);
    }

    function setRobotMood(mood) {
      const { armorMat, accentMat, glowMat, ringMat, defaultBodyHex, defaultAccentHex, defaultGlowHex } = player.userData;
      if (mood === 'shocked') {
        armorMat.color.setHex(0x334155);
        accentMat.color.setHex(0xef4444);
        glowMat.color.setHex(0xef4444);
        ringMat.color.setHex(0xef4444);
      } else if (mood === 'happy') {
        armorMat.color.setHex(defaultBodyHex);
        accentMat.color.setHex(defaultAccentHex);
        glowMat.color.setHex(0x34d399);
        ringMat.color.setHex(0x34d399);
      } else {
        armorMat.color.setHex(defaultBodyHex);
        accentMat.color.setHex(defaultAccentHex);
        glowMat.color.setHex(defaultGlowHex);
        ringMat.color.setHex(defaultAccentHex);
      }
    }

    function initAmbientShapes() {
      const geos = [
        new THREE.IcosahedronGeometry(1.1, 0),

        new THREE.TorusGeometry(0.85, 0.24, 14, 32),

        const mat = new THREE.MeshPhysicalMaterial({
          color: colors[i % colors.length],
          roughness: 0.2,
          metalness: 0.65,
          clearcoat: 0.6,
          transparent: true,
          opacity: 0.65
        });
        const mesh = new THREE.Mesh(geo, mat);
        const side = i % 2 === 0 ? -1 : 1;
        mesh.position.set(
          side * randInt(9, 19),
          randInt(-3, 7),
          -i * 3.8 + 6
        );
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        mesh.userData = {
          rotSpeedX: (Math.random() - 0.5) * 0.018,
          rotSpeedY: (Math.random() - 0.5) * 0.018
        };
        scene.add(mesh);
        ambientShapes.push(mesh);
      }
    }
    initAmbientShapes();

    // 创建超炫酷多层全息能量矩阵方格 (3D Holo-Tech Platform)
    function createTile(x, z, label, isStart = false, optionIndex = -1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const primaryColor = isStart ? 0x38bdf8 : 0x818cf8;
      const topTex = createNumberTexture(label, isStart ? 'start' : 'normal');

      // 1. 中心玻璃钢化数字主面板
      const sideMat = new THREE.MeshPhysicalMaterial({
        color: 0x0f172a,
        roughness: 0.2,
        metalness: 0.85,
        clearcoat: 0.9
      });
      const topMat = new THREE.MeshStandardMaterial({
        map: topTex,
        roughness: 0.15,
        metalness: 0.2,
        emissive: primaryColor,
        emissiveMap: topTex,
        emissiveIntensity: 0.32
      });

      const materials = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];
      const boxGeo = new THREE.BoxGeometry(2.15, 0.42, 2.15);
      const boxMesh = new THREE.Mesh(boxGeo, materials);
      boxMesh.position.y = -0.21;
      boxMesh.receiveShadow = true;
      boxMesh.castShadow = true;
      group.add(boxMesh);

      // 2. 外围装甲斜切护框 (Octagonal Mech Frame)
      const frameGeo = new THREE.CylinderGeometry(1.68, 1.45, 0.36, 8);
      const frameMat = new THREE.MeshStandardMaterial({
        color: 0x1e1b4b,
        metalness: 0.8,
        roughness: 0.25
      });
      const frameMesh = new THREE.Mesh(frameGeo, frameMat);
      frameMesh.position.y = -0.24;
      frameMesh.rotation.y = Math.PI / 8;
      group.add(frameMesh);

      // 3. 动态自转六边形全息能量环 (Rotating Holo Ring)
      const holoRingGeo = new THREE.TorusGeometry(1.56, 0.045, 10, 6);
      const holoRingMat = new THREE.MeshBasicMaterial({
        color: primaryColor,
        transparent: true,
        opacity: 0.85
      });
      const glowMesh = new THREE.Mesh(holoRingGeo, holoRingMat);
      glowMesh.rotation.x = Math.PI / 2;
      glowMesh.position.y = -0.18;
      group.add(glowMesh);

      // 4. 四角悬浮能量水晶柱 (4 Corner Floating Pylons)
      const pylons = new THREE.Group();
      const pylonGeo = new THREE.OctahedronGeometry(0.16, 0);
      const pylonMat = new THREE.MeshBasicMaterial({ color: isStart ? 0x22d3ee : 0xc084fc });
      const offsets = [[-1.12, -1.12], [1.12, -1.12], [-1.12, 1.12], [1.12, 1.12]];
      offsets.forEach(([ox, oz]) => {
        const pMesh = new THREE.Mesh(pylonGeo, pylonMat);
        pMesh.position.set(ox, 0.08, oz);
        pylons.add(pMesh);
      });
      group.add(pylons);

      // 5. 底部反重力能量椎体核心 (Anti-Gravity Thruster Core)
      const thrusterGeo = new THREE.ConeGeometry(0.95, 0.75, 6);
      const thrusterMat = new THREE.MeshBasicMaterial({
        color: primaryColor,
        wireframe: true,
        transparent: true,
        opacity: 0.45
      });
      const thrusterMesh = new THREE.Mesh(thrusterGeo, thrusterMat);
      thrusterMesh.rotation.x = Math.PI;
      thrusterMesh.position.y = -0.78;
      group.add(thrusterMesh);

      group.userData = {
        boxMesh,
        glowMesh,
        pylons,
        pylonMat,
        thrusterMesh,
        topMat,
        label,
        optionIndex,
        broken: false,
        urgentMode: false,
        phase: Math.random() * Math.PI * 2
      };

      scene.add(group);
      activeTiles.push(group);
      return group;
    }

    function spawnLightningStrike(pos) {
      const points = [];
      let currY = 16;
      while (currY >= 0) {
        points.push(new THREE.Vector3(
          pos.x + (currY > 0.5 ? (Math.random() - 0.5) * 1.6 : 0),
          currY,
          pos.z + (currY > 0.5 ? (Math.random() - 0.5) * 1.6 : 0)
        ));
        currY -= 1.3;
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.16, 8, false);
      const tubeMat = new THREE.MeshBasicMaterial({
        color: 0xfca5a5,
        transparent: true,
        opacity: 1
      });
      const bolt = new THREE.Mesh(tubeGeo, tubeMat);
      scene.add(bolt);
      lightningBolts.push({ mesh: bolt, life: 1.0 });

      lightningLight.position.set(pos.x, 4, pos.z);
      lightningLight.intensity = 6.5;
    }

    function spawnParticles(pos, colorHex, count = 35, isShatter = false) {
      for (let i = 0; i < count; i++) {
        const size = isShatter ? randInt(24, 48) / 100 : randInt(14, 28) / 100;
        const geo = isShatter
          ? new THREE.DodecahedronGeometry(size, 0)
          : new THREE.OctahedronGeometry(size, 0);

        const palette = isShatter
          ? [0xef4444, 0xdc2626, 0x1e293b, 0xfca5a5, 0xf97316]
          : [0x34d399, 0x38bdf8, 0xfbbf24, 0xe879f9, 0xa7f3d0];

        const mat = new THREE.MeshStandardMaterial({
          color: colorHex || palette[i % palette.length],
          roughness: 0.2,
          metalness: 0.6,
          emissive: isShatter ? 0x7f1d1d : 0x064e3b,
          emissiveIntensity: 0.4
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.x += (Math.random() - 0.5) * 1.5;
        mesh.position.y += (Math.random() - 0.2) * 0.6;
        mesh.position.z += (Math.random() - 0.5) * 1.5;

        const velocity = new THREE.Vector3(
          (Math.random() - 0.5) * (isShatter ? 0.34 : 0.3),
          isShatter ? Math.random() * 0.28 + 0.08 : Math.random() * 0.32 + 0.14,
          (Math.random() - 0.5) * (isShatter ? 0.34 : 0.3)
        );

        scene.add(mesh);
        particles.push({
          mesh,
          velocity,
          rotSpeed: new THREE.Vector3(Math.random() * 0.25, Math.random() * 0.25, Math.random() * 0.25),
          life: 1.0,
          decay: isShatter ? 0.015 : 0.018
        });
      }
    }

    function spawnShockwave(pos, colorHex = 0x34d399) {
      const geo = new THREE.RingGeometry(0.45, 0.78, 36);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(pos.x, 0.05, pos.z);
      scene.add(mesh);
      shockwaves.push({ mesh, scale: 1, alpha: 0.95 });
    }

    function showFloatingReward(text, isPositive = true) {
      const container = document.getElementById('floating-text-container');
      const el = document.createElement('div');
      el.className = `floating-reward text-3xl sm:text-5xl font-black tracking-tight px-6 py-2.5 rounded-2xl ${
        isPositive
          ? 'text-emerald-300 drop-shadow-[0_8px_28px_rgba(16,185,129,0.85)]'
          : 'text-rose-400 drop-shadow-[0_8px_32px_rgba(244,63,94,0.95)]'
      }`;
      el.innerText = text;
      container.appendChild(el);
      setTimeout(() => el.remove(), 1250);
    }

    function reshuffleCurrentRowOptions() {
      if (!currentQuestion || currentRowTiles.length === 0) return;

      const freshOptions = buildSmartOptions(currentQuestion.answer);
      currentQuestion.options = freshOptions;
      currentQuestion.correctIndex = freshOptions.indexOf(currentQuestion.answer);

      currentRowTiles.forEach((tile, idx) => {
        const val = freshOptions[idx];
        tile.userData.label = val;
        tile.userData.broken = false;
        tile.userData.urgentMode = false;
        tile.visible = true;
        tile.position.y = -2.2;
        const newTex = createNumberTexture(val, 'normal');
        tile.userData.boxMesh.material[2].map = newTex;
        tile.userData.boxMesh.material[2].emissiveMap = newTex;
        tile.userData.pylonMat.color.setHex(0xc084fc);
        tile.userData.glowMesh.material.color.setHex(0x6366f1);

        const btnVal = document.getElementById(`opt-val-${idx}`);
        const btn = document.getElementById(`opt-btn-${idx}`);
        if (btnVal) btnVal.innerText = val;
        if (btn) btn.disabled = false;
      });
    }

    function spawnNextQuestionRow() {
      currentQuestion = generateGrade2Problem(currentMode);
      timeRemaining = maxTimePerQuestion;
      lastTickSecond = Math.ceil(timeRemaining);

      document.getElementById('question-text').innerText = currentQuestion.questionText;
      document.getElementById('mode-badge').innerText = currentQuestion.modeLabel;
      document.getElementById('question-card').classList.remove('urgent-card');

      const nextZ = -(currentStep + 1) * ROW_SPACING;
      currentRowTiles = [];

      currentQuestion.options.forEach((val, idx) => {
        const tile = createTile(LANE_X[idx], nextZ, val, false, idx);
        tile.position.y = -2.8;
        currentRowTiles.push(tile);

        const btnVal = document.getElementById(`opt-val-${idx}`);
        const btn = document.getElementById(`opt-btn-${idx}`);
        if (btnVal) btnVal.innerText = val;
        if (btn) btn.disabled = false;
      });

      while (activeTiles.length > 22) {
        const old = activeTiles.shift();
        scene.remove(old);
      }

      updateHUD();
    }

    function resetGame() {
      score = 100;
      streak = 0;
      hearts = 3;
      currentStep = 0;
      isAnimating = false;
      setRobotMood('normal');

      activeTiles.forEach(t => scene.remove(t));
      activeTiles.length = 0;

      createTile(0, 0, 'START', true, -1);
      player.position.set(0, 0, 0);
      player.rotation.set(0, 0, 0);

      spawnNextQuestionRow();
    }

    function executeHeavyPenalty(strikePos, returnPos, reasonText) {
      streak = 0;
      const penaltyPoints = 25;
      score = Math.max(0, score - penaltyPoints);
      hearts = Math.max(0, hearts - 1);

      sfx.playThunderPenalty();
      setRobotMood('shocked');

      spawnLightningStrike(strikePos);
      spawnParticles(strikePos, null, 42, true);
      spawnShockwave(strikePos, 0xef4444);

      document.body.classList.add('shake-heavy');
      const overlay = document.getElementById('damage-overlay');
      overlay.style.opacity = '1';
      setTimeout(() => {
        document.body.classList.remove('shake-heavy');
        overlay.style.opacity = '0';
      }, 650);

      if (hearts === 0) {
        showFloatingReward(`⚡ 护盾击穿！-${penaltyPoints}分 · 重新充能`, false);
        hearts = 3;
      } else {
        showFloatingReward(`${reasonText} -${penaltyPoints}分！选项已重排`, false);
      }

      updateHUD();

      let fallT = 0;
      const recoverInterval = setInterval(() => {
        fallT += 0.065;
        if (fallT < 0.55) {
          player.position.y -= 0.26;
          player.rotation.z += 0.38;
          player.rotation.x += 0.25;
        } else if (fallT < 1.0) {
          const t = (fallT - 0.55) / 0.45;
          player.position.lerpVectors(strikePos, returnPos, t);
          player.position.y = Math.sin(t * Math.PI) * 2.4;
          player.rotation.set(0, 0, 0);
        } else {
          clearInterval(recoverInterval);
          player.position.copy(returnPos);
          player.rotation.set(0, 0, 0);
          setRobotMood('normal');
          spawnShockwave(returnPos, 0x38bdf8);

          reshuffleCurrentRowOptions();
          timeRemaining = maxTimePerQuestion;
          lastTickSecond = Math.ceil(timeRemaining);
          document.getElementById('question-card').classList.remove('urgent-card');
          isAnimating = false;
        }
      }, 20);
    }

    let jumpAnim = null;

    window.handleChoice = function(optionIdx) {
      if (isAnimating || !currentRowTiles[optionIdx]) return;
      const targetTile = currentRowTiles[optionIdx];
      if (targetTile.userData.broken) return;

      isAnimating = true;
      sfx.playJump();

      const startPos = player.position.clone();
      const endPos = new THREE.Vector3(targetTile.position.x, 0, targetTile.position.z);
      const isCorrect = optionIdx === currentQuestion.correctIndex;

      jumpAnim = {
        startPos,
        endPos,
        targetTile,
        optionIdx,
        isCorrect,
        progress: 0,
        duration: 0.42
      };
    };

    function onJumpLanded(anim) {
      const { targetTile, isCorrect, startPos, endPos } = anim;

      if (isCorrect) {
        streak++;
        const speedBonus = Math.ceil(timeRemaining * 2);
        const gained = 20 + streak * 5 + speedBonus;
        score += gained;
        currentStep++;

        sfx.playSuccess(streak);
        setRobotMood('happy');
        const okTex = createNumberTexture(targetTile.userData.label, 'correct');
        targetTile.userData.boxMesh.material[2].map = okTex;
        targetTile.userData.boxMesh.material[2].emissiveMap = okTex;
        targetTile.userData.pylonMat.color.setHex(0x34d399);
        targetTile.userData.glowMesh.material.color.setHex(0x10b981);

        spawnParticles(endPos, null, 38, false);
        spawnShockwave(endPos, 0x34d399);
        showFloatingReward(`+${gained}分 (含极速奖+${speedBonus}) 🔥x${streak}`, true);

        ambientShapes.forEach(mesh => {
          if (mesh.position.z > player.position.z + 14) {
            mesh.position.z -= 110;
          }
        });

        setTimeout(() => {
          setRobotMood('normal');
          spawnNextQuestionRow();
          isAnimating = false;
        }, 240);
      } else {
        targetTile.userData.broken = true;
        targetTile.visible = false;
        executeHeavyPenalty(endPos, startPos, '💥 算错雷击');
      }
    }

    function onTimerExpired() {
      if (isAnimating) return;
      isAnimating = true;

      currentRowTiles.forEach(tile => {
        tile.userData.broken = true;
        tile.visible = false;
        spawnParticles(tile.position, 0xef4444, 10, true);
      });

      const currentPos = player.position.clone();
      executeHeavyPenalty(currentPos, currentPos, '⏰ 超时坍塌');
    }

    /**************************************************************
     * 5. 交互控制与快捷键绑定 (1-5 数字键)
     **************************************************************/
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('select')) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const meshes = currentRowTiles
        .filter(t => !t.userData.broken)
        .map(t => t.userData.boxMesh);

      const intersects = raycaster.intersectObjects(meshes);
      if (intersects.length > 0) {
        const hitGroup = intersects[0].object.parent;
        if (hitGroup && hitGroup.userData.optionIndex !== undefined) {
          handleChoice(hitGroup.userData.optionIndex);
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (['1', '2', '3', '4', '5'].includes(e.key)) {
        handleChoice(parseInt(e.key, 10) - 1);
      }
    });

    document.getElementById('mode-select').addEventListener('change', (e) => {
      currentMode = e.target.value;
      resetGame();
    });

    document.getElementById('char-select').addEventListener('change', (e) => {
      switchCharacterModel(e.target.value);
    });

    document.getElementById('speed-select').addEventListener('change', (e) => {
      maxTimePerQuestion = parseInt(e.target.value, 10);
      resetGame();
    });

    document.getElementById('sound-btn').addEventListener('click', (e) => {
      sfx.enabled = !sfx.enabled;
      e.currentTarget.innerText = sfx.enabled ? '🔊' : '🔇';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /**************************************************************
     * 6. 主渲染循环 (含紧迫倒计时系统与 3D 物理动态)
     **************************************************************/
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      if (!isAnimating && currentQuestion) {
        timeRemaining = Math.max(0, timeRemaining - dt);
        const pct = (timeRemaining / maxTimePerQuestion) * 100;
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const qCard = document.getElementById('question-card');

        timerBar.style.width = `${pct}%`;
        timerText.innerText = `${timeRemaining.toFixed(1)}s`;

        const ceilSec = Math.ceil(timeRemaining);
        if (ceilSec !== lastTickSecond && ceilSec > 0) {
          lastTickSecond = ceilSec;
          if (ceilSec <= 5) {
            sfx.playTick(true);
          } else if (ceilSec <= 10) {
            sfx.playTick(false);
          }
        }

        if (timeRemaining <= 10) {
          timerBar.className = 'h-full rounded-full bg-gradient-to-r from-red-500 via-rose-500 to-amber-500 transition-all duration-75';
          timerText.className = 'text-rose-400 font-mono text-sm font-black animate-ping';
          qCard.classList.add('urgent-card');

          currentRowTiles.forEach(tile => {
            if (!tile.userData.broken && !tile.userData.urgentMode) {
              tile.userData.urgentMode = true;
              const urgTex = createNumberTexture(tile.userData.label, 'urgent');
              tile.userData.boxMesh.material[2].map = urgTex;
              tile.userData.boxMesh.material[2].emissiveMap = urgTex;
              tile.userData.glowMesh.material.color.setHex(0xef4444);
            }
          });
        } else {
          timerBar.className = 'h-full rounded-full bg-gradient-to-r from-emerald-400 via-cyan-400 to-indigo-400 transition-all duration-75';
          timerText.className = 'text-amber-300 font-mono text-sm';
        }

        if (timeRemaining <= 0) {
          onTimerExpired();
        }
      }

      // 骨骼动画控制器 (Skeletal Rig Animation State Machine)
      const rig = player.userData;
      rig.chestCore.rotation.y += 0.08;
      rig.chestCore.rotation.x += 0.05;
      rig.ring.rotation.z -= 0.04;
      rig.ring.scale.setScalar(1 + Math.sin(elapsed * 7) * 0.1);

      // 能量光翼扇动骨骼动画
      const wingFlap = Math.sin(elapsed * (jumpAnim ? 18 : 6)) * 0.22;
      rig.leftWingPivot.rotation.y = wingFlap;
      rig.rightWingPivot.rotation.y = -wingFlap;

      if (!jumpAnim && !isAnimating) {
        // 待机战斗呼吸姿态 (Idle Combat Stance)
        const breath = Math.sin(elapsed * 4.5);
        const sway = Math.cos(elapsed * 2.25);

        const basePelvisY = rig.charType === 'patrick' ? 0.72 : (rig.charType === 'spongebob' ? 0.78 : 0.92);
        rig.pelvis.position.y = basePelvisY + Math.abs(breath) * 0.09;
        rig.pelvis.rotation.set(0, sway * 0.1, 0);
        rig.spine.rotation.x = 0.08 + breath * 0.04;
        rig.headGroup.rotation.y = -sway * 0.15;
        rig.headGroup.rotation.x = Math.sin(elapsed * 3) * 0.06;

        // 双臂自然摆动屈肘
        rig.leftArmRig.shoulder.rotation.x = -0.25 + breath * 0.18;
        rig.leftArmRig.shoulder.rotation.z = 0.18 + Math.abs(breath) * 0.08;
        rig.leftArmRig.elbow.rotation.x = -0.65 - breath * 0.12;

        rig.rightArmRig.shoulder.rotation.x = 0.25 - breath * 0.18;
        rig.rightArmRig.shoulder.rotation.z = -0.18 - Math.abs(breath) * 0.08;
        rig.rightArmRig.elbow.rotation.x = -0.65 + breath * 0.12;

        // 双腿微曲蓄力缓冲姿态
        rig.leftLegRig.hip.rotation.x = -0.22 - Math.abs(breath) * 0.1;
        rig.leftLegRig.knee.rotation.x = 0.44 + Math.abs(breath) * 0.2;
        rig.leftLegRig.ankle.rotation.x = -0.22;

        rig.rightLegRig.hip.rotation.x = -0.18 - Math.abs(breath) * 0.1;
        rig.rightLegRig.knee.rotation.x = 0.36 + Math.abs(breath) * 0.2;
        rig.rightLegRig.ankle.rotation.x = -0.18;
      }

      if (jumpAnim) {
        jumpAnim.progress += dt / jumpAnim.duration;
        const t = Math.min(jumpAnim.progress, 1);

        player.position.lerpVectors(jumpAnim.startPos, jumpAnim.endPos, t);
        player.position.y = Math.sin(t * Math.PI) * 3.1;

        // 空中360度英雄空翻 + 四肢骨骼动态舒展与收腿
        rig.pelvis.rotation.x = -t * Math.PI * 2;
        const airPose = Math.sin(t * Math.PI);
        rig.spine.rotation.x = 0.25 * airPose;

        // 起跳双臂后掠蓄力 -> 空中张开 -> 落地缓冲
        rig.leftArmRig.shoulder.rotation.x = -1.8 * airPose;
        rig.leftArmRig.shoulder.rotation.z = 0.65 * airPose;
        rig.leftArmRig.elbow.rotation.x = -0.9 * airPose;

        rig.rightArmRig.shoulder.rotation.x = -1.8 * airPose;
        rig.rightArmRig.shoulder.rotation.z = -0.65 * airPose;
        rig.rightArmRig.elbow.rotation.x = -0.9 * airPose;

        // 空中帅气一前一后凌空飞跃腿姿
        rig.leftLegRig.hip.rotation.x = -0.95 * airPose;
        rig.leftLegRig.knee.rotation.x = 1.45 * airPose;
        rig.rightLegRig.hip.rotation.x = 0.45 * airPose;
        rig.rightLegRig.knee.rotation.x = 0.85 * airPose;

        if (t >= 1) {
          player.position.copy(jumpAnim.endPos);
          player.rotation.set(0, 0, 0);
          rig.pelvis.rotation.set(0, 0, 0);
          const finished = jumpAnim;
          jumpAnim = null;
          onJumpLanded(finished);
        }
      }

      // 3D 全息矩阵方格多重动态特效 (外环旋转、四角水晶上下浮动、底部推进器呼吸)
      activeTiles.forEach(tile => {
        if (!tile.userData.broken) {
          let targetY = Math.sin(elapsed * 2.8 + tile.userData.phase) * 0.1;
          tile.userData.glowMesh.rotation.z += tile.userData.urgentMode ? 0.08 : 0.025;
          tile.userData.thrusterMesh.rotation.y -= 0.04;

          // 四角悬浮水晶自转与呼吸升降
          tile.userData.pylons.children.forEach((pMesh, idx) => {
            pMesh.rotation.y += 0.06;
            pMesh.position.y = 0.12 + Math.sin(elapsed * 5 + idx + tile.userData.phase) * 0.08;
          });

          if (tile.userData.urgentMode) {
            tile.position.x = LANE_X[tile.userData.optionIndex] + (Math.random() - 0.5) * 0.16;
            targetY -= 0.25;
            tile.userData.pylonMat.color.setHex(0xef4444);
          } else if (tile.userData.optionIndex >= 0) {
            tile.position.x = LANE_X[tile.userData.optionIndex];
          }
          tile.position.y += (targetY - tile.position.y) * 0.14;
        }
      });

      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const b = lightningBolts[i];
        b.life -= 0.06;
        b.mesh.material.opacity = Math.max(0, b.life);
        if (b.life <= 0) {
          scene.remove(b.mesh);
          lightningBolts.splice(i, 1);
        }
      }
      if (lightningLight.intensity > 0) {
        lightningLight.intensity = Math.max(0, lightningLight.intensity - 0.35);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.add(p.velocity);
        p.velocity.y -= 0.012;
        p.mesh.rotation.x += p.rotSpeed.x;
        p.mesh.rotation.y += p.rotSpeed.y;
        p.life -= p.decay;
        p.mesh.scale.setScalar(Math.max(0.001, p.life));
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.scale += 0.18;
        sw.alpha -= 0.038;
        sw.mesh.scale.setScalar(sw.scale);
        sw.mesh.material.opacity = Math.max(0, sw.alpha);
        if (sw.alpha <= 0) {
          scene.remove(sw.mesh);
          shockwaves.splice(i, 1);
        }
      }

      const positions = starGeo.attributes.position.array;
      for (let i = 0; i < starCount; i++) {
        positions[i * 3 + 2] += 0.18;
        if (positions[i * 3 + 2] > player.position.z + 15) {
          positions[i * 3 + 2] = player.position.z - 105;
        }
      }
      starGeo.attributes.position.needsUpdate = true;
      gridHelper.position.z = Math.floor(player.position.z / 4) * 4;

      ambientShapes.forEach(mesh => {
        mesh.rotation.x += mesh.userData.rotSpeedX;
        mesh.rotation.y += mesh.userData.rotSpeedY;
      });

      const desiredCamPos = new THREE.Vector3(
        player.position.x * 0.38,
        6.8,
        player.position.z + 8.8
      );
      camera.position.lerp(desiredCamPos, 0.08);
      camera.lookAt(player.position.x * 0.22, 0.5, player.position.z - 3.6);

      playerLight.position.set(player.position.x, player.position.y + 4.5, player.position.z);

      renderer.render(scene, camera);
    }

    resetGame();
    animate();
  </script>
</body>
</html>
