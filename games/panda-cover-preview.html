<!doctype html><meta charset="utf-8"><title>熊猫游戏封面预览</title>
<style>body{margin:25px;background:#f5f8ee;font:16px sans-serif;text-align:center}canvas{width:min(100%,1000px);height:auto;border-radius:24px}button{display:block;margin:20px auto;padding:12px 25px}</style>
<script src="vendor/three.min.js"></script><script src="panda-world.js"></script>
<button id="download">下载游戏封面</button><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe4f2e9);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,720);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(42,1200/720,.1,100);camera.position.set(4.5,4.1,9);camera.lookAt(0,1.2,0);
scene.add(new THREE.HemisphereLight(0xfffcf1,0x94b9a5,.85));const sun=new THREE.DirectionalLight(0xfff3d3,1.1);sun.position.set(-5,9,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const panda=buildPandaRig();panda.rotation.y=.25;panda.position.y=.45;animatePanda(panda,1.5,0,.58,false);scene.add(panda);
for(const [x,z,scale] of [[0,0,1],[-3,-2,.75],[3,-3,.8]]){const g=new THREE.Group(),top=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.4,.25,48),pandaMaterial(0xa5ce8b)),base=new THREE.Mesh(new THREE.CylinderGeometry(1.4,.8,.8,9),pandaMaterial(0xc4a77e));top.position.y=-.15;base.position.y=-.65;top.receiveShadow=true;g.add(top,base);g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);}
for(const [x,y,z,kind] of [[-4,2.5,-4,'cloud'],[4,3,-5,'cloud'],[-3,-.8,-5,'tree'],[4,-1,-7,'tree']]){const p=makeGardenProp(kind);p.position.set(x,y,z);scene.add(p);}
for(const [x,y,z] of [[-1.8,2.5,0],[1.7,3,-1],[2.4,1.5,1]]){const star=pandaStar(pandaMaterial(0xefc363),.21);star.position.set(x,y,z);star.rotation.z=.2;scene.add(star);}
renderer.render(scene,camera);document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.download='panda-garden-cover.png';a.href=renderer.domElement.toDataURL('image/png');a.click();};
</script>
